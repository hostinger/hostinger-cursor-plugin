name: mcp-sync

# Opens (or refreshes) one PR that brings skills/ and the operation catalog up
# to a published @hostinger/mcp release. Every run rebuilds from main, so
# several releases between merges collapse into one PR and one bump. If the
# release renamed operations the hand-written rules/agents/commands use, CI's
# check-tool-names fails on the PR; fix those names on the PR branch.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "@hostinger/mcp version (default: latest)"
        required: false
        type: string

concurrency:
  group: mcp-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # PRs opened with GITHUB_TOKEN don't trigger ci.yml, so use the App.
      - name: Get GitHub token
        uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.HOSTINGERBOT_APP_ID }}
          private-key: ${{ secrets.HOSTINGERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-$(npm view @hostinger/mcp version)}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Sync skills and operation catalog
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          node scripts/sync-skills.mjs "$V"
          node scripts/sync-mcp-tools.mjs "$V"

      # No early exit on an empty diff: create-pull-request then closes a stale
      # chore/mcp-sync PR, which is what we want once main has caught up.
      - name: Bump version and CHANGELOG
        id: bump
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Already in sync with @hostinger/mcp $V."
            exit 0
          fi
          CHANGES=$(git diff --cached --name-only | sed -E \
            -e 's#^skills/([^/]+)/.*#\1#' \
            -e 's#^scripts/mcp-tools\.json$#operation catalog#' | sort -u | paste -sd, - | sed 's/,/, /g')
          OLD=$(jq -r .version .cursor-plugin/plugin.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          jq --arg v "$NEW" '.version = $v' .cursor-plugin/plugin.json > plugin.tmp
          mv plugin.tmp .cursor-plugin/plugin.json
          sed -i "s/plugin;cursor;$OLD/plugin;cursor;$NEW/g" mcp.json
          ENTRY="## [$NEW] - $(date -u +%F)\n\n### Changed\n\n- Synced with \`@hostinger/mcp\` $V: $CHANGES\n"
          awk -v e="$ENTRY" 'NR==2 { print; printf "%s\n", e; next } { print }' CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open or update the sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.token.outputs.token }}
          branch: chore/mcp-sync
          base: main
          delete-branch: true
          sign-commits: true
          add-paths: .
          commit-message: "chore: sync with @hostinger/mcp ${{ steps.version.outputs.version }}"
          title: "chore: sync with @hostinger/mcp ${{ steps.version.outputs.version }}"
          body: |
            Synced with `@hostinger/mcp` ${{ steps.version.outputs.version }}; version bumped to ${{ steps.bump.outputs.new }}.
            If CI's check-tool-names fails, the release renamed operations the hand-written rules/agents/commands use — fix them on this branch before merging.
